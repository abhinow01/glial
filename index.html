<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Footage Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #titlebar {
      height: 38px;
      background: #0f0f0f;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    #top {
      padding: 0 24px 16px;
      background: #0f0f0f;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    #folder-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    #folder-path {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 12px;
      color: #999;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #333; }
    #index-btn {
      background: #7c3aed;
      border-color: #7c3aed;
      color: #fff;
    }
    #index-btn:hover { background: #6d28d9; }
    #search-row {
      display: flex;
      gap: 10px;
    }
    #search-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 16px;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
    }
    #search-input:focus { border-color: #7c3aed; }
    #search-btn {
      background: #7c3aed;
      border-color: #7c3aed;
      color: #fff;
      padding: 10px 20px;
      font-size: 15px;
    }
    #status {
      padding: 8px 24px;
      font-size: 12px;
      color: #666;
      background: #0f0f0f;
      border-bottom: 1px solid #1a1a1a;
      min-height: 32px;
      flex-shrink: 0;
    }
    #results {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      align-content: start;
    }
    .result-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .result-card:hover {
      border-color: #7c3aed;
      transform: translateY(-2px);
    }
    .result-card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .result-info {
      padding: 10px 12px;
    }
    .result-file {
      font-size: 12px;
      color: #ccc;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-time {
      font-size: 11px;
      color: #7c3aed;
      margin-top: 3px;
    }
    #empty {
      grid-column: 1/-1;
      text-align: center;
      color: #444;
      font-size: 15px;
      margin-top: 80px;
    }
    .thumb-wrap {
  position: relative;
  cursor: pointer;
}
.thumb-wrap img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: #111;
}
.timestamp-badge {
  position: absolute;
  bottom: 6px;
  right: 8px;
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 4px;
  pointer-events: none;
}
.result-meta {
  font-size: 11px;
  color: #666;
  display: flex;
  gap: 6px;
  margin-top: 3px;
}
.rename-row {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.rename-input {
  flex: 1;
  background: #111;
  border: 1px solid #333;
  border-radius: 5px;
  padding: 4px 8px;
  color: #ccc;
  font-size: 12px;
  outline: none;
}
.rename-input:focus {
  border-color: #7c3aed;
}
.rename-btn {
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 5px;
  color: #ccc;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.rename-btn:hover { background: #333; }
  </style>
</head>
<body>
  <div id="titlebar"></div>
  <div id="top">
    <div id="folder-row">
      <div id="folder-path">No folder selected</div>
      <button id="pick-btn">Choose folder</button>
      <button id="index-btn">Index footage</button>
    </div>
    <div id="search-row">
      <input id="search-input" placeholder='Search your footage — try "sunset on beach" or "person talking to camera"' />
      <button id="search-btn">Search</button>
    </div>
  </div>
  <div id="status">Ready. Pick a folder and click "Index footage" to start.</div>
  <div id="results">
    <div id="empty">Your search results will appear here</div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
