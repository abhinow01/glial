<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clippit</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Splash ─────────────────────────────────────────────────────── */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transform: translateY(0%);
      transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1);
    }

    #splash.slide-up {
      transform: translateY(-100%);
    }

    /* Solid dark base */
    #splash-bg {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      z-index: 0;
    }

    /* Glassmorphism layer — covers the whole splash */
    #splash-glass {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(40px) saturate(1.2);
      -webkit-backdrop-filter: blur(40px) saturate(1.2);
      z-index: 1;
    }

    /* Subtle white orbs — no color, just luminance */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0;
      animation: orb-in 2s ease forwards;
      z-index: 2;
      pointer-events: none;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.07), transparent 70%);
      top: -150px; left: -150px;
      animation-delay: 0.1s;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(255,255,255,0.05), transparent 70%);
      bottom: -120px; right: -120px;
      animation-delay: 0.4s;
    }
    .orb-3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(255,255,255,0.04), transparent 70%);
      top: 35%; left: 55%;
      animation-delay: 0.7s;
    }

    @keyframes orb-in {
      to { opacity: 1; }
    }

    /* Title — centered, no card box around it */
    #splash-content {
      position: relative;
      z-index: 3;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      animation: content-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    }

    @keyframes content-in {
      to { opacity: 1; transform: translateY(0); }
    }

    #splash-title {
      font-size: 56px;
      font-weight: 600;
      letter-spacing: -2px;
      color: #ffffff;
      min-height: 68px;
      min-width: 10px;
      display: inline-block;
    }

    /* Blinking cursor */
    #cursor {
      display: inline-block;
      width: 3px;
      height: 52px;
      background: rgba(255,255,255,0.7);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.7s step-end infinite;
    }

    #cursor.hidden { display: none; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    #splash-sub {
      margin-top: 16px;
      font-size: 14px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in 0.6s ease 2s forwards;
    }

    @keyframes fade-in {
      to { opacity: 1; }
    }

    /* ── Main app ────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #titlebar {
      height: 38px;
      background: #0a0a0a;
      -webkit-app-region: drag;
      flex-shrink: 0;
    }

    #top {
      padding: 0 24px 16px;
      background: #0a0a0a;
      border-bottom: 1px solid #1c1c1c;
      flex-shrink: 0;
    }

    #folder-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    #folder-path {
      flex: 1;
      background: #111;
      border: 1px solid #fff;
      border-radius: 8px;
      padding: 8px 12px;
      color: #666;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
   #folder-path::placeholder { color: #ccc; }

    button {
      background: transparent;
      border: 1px solid #fff;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    button:hover { background: #fff; color: #000; }

    #search-row { display: flex; gap: 10px; }

    #search-input {
      flex: 1;
      background: #111;
      border: 1px solid #fff;
      border-radius: 8px;
      padding: 10px 16px;
      color: #e0e0e0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s;
    }
    #search-input::placeholder { color: #ccc; }
    #search-input:focus { border-color: #fff; }

    #search-btn {
      padding: 10px 20px;
      font-size: 15px;
    }

    #status {
      padding: 8px 24px;
      font-size: 12px;
      color: #ccc;
      border-bottom: 1px solid #161616;
      min-height: 32px;
      flex-shrink: 0;
    }

    #results {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      align-content: start;
    }

    .result-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
    }
    .result-card:hover {
      border-color: #fff;
      transform: translateY(-2px);
    }

    .thumb-wrap {
      position: relative;
      cursor: grab;
    }
    .thumb-wrap:active { cursor: grabbing; }
    .thumb-wrap img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      display: block;
      background: #0a0a0a;
    }
    .thumb-wrap::after {
      content: '⠿';
      position: absolute;
      top: 6px; left: 8px;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .thumb-wrap:hover::after { opacity: 1; }

    .timestamp-badge {
      position: absolute;
      bottom: 6px; right: 8px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      pointer-events: none;
    }

    .result-info { padding: 10px 12px; }

    .result-file {
      font-size: 12px;
      color: #ccc;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-meta {
      font-size: 11px;
      color: #444;
      display: flex;
      gap: 6px;
      margin-top: 3px;
    }

    .rename-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .rename-input {
      flex: 1;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 5px;
      padding: 4px 8px;
      color: #ccc;
      font-size: 12px;
      outline: none;
    }
    .rename-input:focus { border-color: #fff; }

    .rename-btn {
      background: transparent;
      border: 1px solid #fff;
      border-radius: 5px;
      color: #fff;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .rename-btn:hover { background: #fff; color: #000; }

    #empty {
      grid-column: 1/-1;
      text-align: center;
      color: #ccc; 
      font-size: 15px;
      margin-top: 80px;
    }
  </style>
</head>
<body>

  <!-- ── Splash ── -->
  <div id="splash">
    <div id="splash-bg"></div>
    <div id="splash-glass"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div id="splash-content">
      <div>
        <span id="splash-title"></span><span id="cursor"></span>
      </div>
      <div id="splash-sub">semantic search for your footage</div>
    </div>
  </div>

  <!-- ── App ── -->
  <div id="app">
    <div id="titlebar"></div>
    <div id="top">
      <div id="folder-row">
        <div id="folder-path">No folder selected</div>
        <button id="pick-btn">Choose folder</button>
        <button id="index-btn">Index footage</button>
      </div>
      <div id="search-row">
        <input id="search-input" placeholder='Try "cats playing" or "sunset on beach"' />
        <button id="search-btn">Search</button>
      </div>
    </div>
    <div id="status">Ready — pick a folder and index your footage to begin.</div>
    <div id="results">
      <div id="empty">Search results will appear here</div>
    </div>
  </div>

  <script>
    const TITLE   = 'Clippit'
    const titleEl = document.getElementById('splash-title')   // ✅ fixed typo
    const cursor  = document.getElementById('cursor')
    const splash  = document.getElementById('splash')

    let i = 0
    function type() {
      if (i < TITLE.length) {
        titleEl.textContent += TITLE[i]   // ✅ fixed: was TITLE.slice(0,i)
        i++
        setTimeout(type, 80 + Math.random() * 40)
      } else {
        cursor.classList.add('hidden')    // hide cursor when done
        setTimeout(() => splash.classList.add('slide-up'), 1000)
      }
    }

    setTimeout(type, 900)
  </script>

  <script src="renderer.js"></script>
</body>
</html>
